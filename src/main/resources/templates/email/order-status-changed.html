<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estado de tu orden actualizado</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f6f6f6; }
        .card { background: #ffffff; border-radius: 8px; padding: 32px; margin: 32px auto; max-width: 600px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { color: #1a73e8; }
        .footer { color: #999; font-size: 12px; margin-top: 24px; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h2>Actualización de tu orden</h2>
    <p th:if="${userName}">Hola <b th:text="${userName}">Cliente</b>,</p>
    <p>Tu orden <b><span th:text="${orderId}">12345</span></b> ha cambiado de estado.</p>
    <p>Nuevo estado: <b th:text="${newStatus}">En proceso</b></p>

    <h3>Resumen de tu pedido</h3>
    <table style="width:100%; border-collapse: collapse;">
        <thead>
        <tr style="background:#f0f0f0; text-align:left;">
            <th style="padding:8px; border:1px solid #ddd;">Producto</th>
            <th style="padding:8px; border:1px solid #ddd;">Cantidad</th>
            <th style="padding:8px; border:1px solid #ddd; text-align:right;">Precio</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td style="padding:8px; border:1px solid #ddd;" th:text="${item['nombre']}">Producto</td>
            <td style="padding:8px; border:1px solid #ddd;" th:text="${item['cantidad']}">1</td>
            <td style="padding:8px; border:1px solid #ddd; text-align:right;" th:text="${#numbers.formatDecimal(item['precioUnitario'],1,2)}">0.00</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="2" style="padding:8px; border:1px solid #ddd; text-align:right; font-weight:bold;">Total:</td>
            <td style="padding:8px; border:1px solid #ddd; text-align:right; font-weight:bold;" th:text="${currency} + ' ' + ${#numbers.formatDecimal(total,1,2)}">CLP 0.00</td>
        </tr>
        </tfoot>
    </table>

    <div class="footer">
        ¡Gracias por confiar en nosotros!<br>
        <b>RabbitHole</b>
    </div>
</div>
</body>
</html>
