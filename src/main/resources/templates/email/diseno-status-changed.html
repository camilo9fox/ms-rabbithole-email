<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualización de tu diseño personalizado</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f6f6f6; }
        .card { background: #ffffff; border-radius: 8px; padding: 32px; margin: 32px auto; max-width: 600px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { color: #1a73e8; }
        .footer { color: #999; font-size: 12px; margin-top: 24px; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h2>Estado de tu diseño actualizado</h2>
    <p>Hola <span th:text="${userName}">Cliente</span>, tu diseño <b><span th:text="${designName}">Diseño</span></b> ha cambiado de estado.</p>
    <img th:src="${previewUrl}" alt="preview" style="max-width:100%;border-radius:6px;margin:16px 0;"/>
    <p>Nuevo estado: <b th:text="${newStatus}">Aprobado</b></p>

    <div class="footer">
        ¡Gracias por confiar en nosotros!<br>
        <b>RabbitHole</b>
    </div>
</div>
</body>
</html>
