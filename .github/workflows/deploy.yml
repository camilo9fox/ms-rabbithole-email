name: Deploy Email Service to EC2

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REMOTE_STACK_DIR: /home/${{ secrets.EC2_USER }}/stacks/email

jobs:
  deploy-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure remote dir on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ${{ env.REMOTE_STACK_DIR }}

      - name: Copy email service files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./*"
          target: "${{ env.REMOTE_STACK_DIR }}"

      - name: Build & launch email stack on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: "15m"
          envs: SMTP_EMAIL,SMTP_PASSWORD
          script: |
            set -e
            cd ${{ env.REMOTE_STACK_DIR }}

            docker compose build --pull
            SMTP_EMAIL=${{ secrets.SMTP_EMAIL }} SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }} \
              docker compose up -d

            docker compose ps
